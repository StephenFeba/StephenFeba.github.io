<html lang="en">

<style>
  :root{
    --ink:#20265C; --paper:#F6F2FC; --paper-2:#EAE1F7; --wine:#4B3A96; --gold:#C9A961; --line:rgba(32,38,92,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--ink); font-family:'Newsreader',serif;
    background:
      radial-gradient(ellipse 140% 90% at 50% 0%, rgba(134,112,201,0.10), transparent 55%),
      linear-gradient(180deg,#FAF7FD 0%,#F5F0FB 40%,#EFE8F9 100%);
  }
  .wrap{max-width:640px; margin:0 auto; padding:36px 16px 60px;}
  header{text-align:center; margin-bottom:26px;}
  .monogram{width:56px; height:56px; display:block; margin:0 auto 12px;}
  h1{font-family:'Fraunces',serif; font-style:italic; font-weight:450; font-size:clamp(30px,8vw,40px); margin:0 0 6px; color:var(--wine);}
  .sub{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6a6255;}
  .lead{text-align:center; font-size:17px; line-height:1.5; margin:0 0 18px; color:#3b3f6b;}

  .search{position:relative;}
  .search input{
    width:100%; font-family:'Newsreader',serif; font-size:20px; padding:15px 16px;
    border:1px solid var(--ink); background:#fff; color:var(--ink); border-radius:0;
    box-shadow:0 14px 28px -20px rgba(32,38,92,0.45);
  }
  .search input:focus{outline:2px solid var(--gold); outline-offset:2px;}
  .hint{font-size:13px; font-style:italic; color:#6a6255; margin:8px 2px 0; text-align:center;}

  .results{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .res{
    display:flex; justify-content:space-between; align-items:center; gap:12px; text-align:left; width:100%;
    border:1px solid var(--line); background:var(--paper); padding:13px 15px; cursor:pointer;
    font-family:'Newsreader',serif; font-size:17px; color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  .res:hover,.res:focus-visible{border-color:var(--gold); background:var(--paper-2); outline:none;}
  .res small{display:block; font-size:13px; font-style:italic; color:#6a6255; margin-top:2px;}
  .res .tb{font-family:'Space Mono',monospace; font-size:12px; color:var(--wine); white-space:nowrap;}

  .card{
    border:1px solid var(--gold); background:var(--paper-2); padding:22px 18px 20px; margin-top:18px; text-align:center;
    box-shadow:0 22px 40px -26px rgba(32,38,92,0.4);
  }
  .card .who{font-family:'Fraunces',serif; font-style:italic; font-size:24px; color:var(--wine); margin:0;}
  .card .via{font-size:14px; font-style:italic; color:#6a6255; margin:2px 0 0;}
  .card .label{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#6a6255; margin:16px 0 0;}
  .bignum{font-family:'Fraunces',serif; font-weight:300; font-size:clamp(84px,26vw,120px); line-height:1; color:var(--ink); margin:2px 0 4px;}
  .party{font-size:15px; color:#3b3f6b; margin:0 0 4px;}

  .map{position:relative; width:100%; aspect-ratio:4/3; background:#fdfcfb; border:1px solid var(--line); margin-top:14px; overflow:hidden;}
  .mapin{position:absolute; inset:0; transition:transform .45s ease;}
  .map.zoomed .mapin{transform:scale(2.4);}
  .zoombtn{margin-top:10px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    background:var(--paper); border:1px solid var(--wine); color:var(--wine); padding:8px 14px; cursor:pointer;}
  .zoombtn:hover{background:var(--wine); color:var(--paper);}
  .pin{position:absolute; transform:translate(-50%,-135%); z-index:8; background:var(--ink); color:#fff; padding:2px 7px;
    font-family:'Space Mono',monospace; font-size:clamp(7px,1.9vw,11px); white-space:nowrap; letter-spacing:0.04em;}
  .pin:after{content:''; position:absolute; left:50%; top:100%; margin-left:-4px; border:4px solid transparent; border-top-color:var(--ink);}
  .map:not(.zoomed) .pin{font-size:clamp(8px,2.2vw,12px);}
  .room{position:absolute; border:1px solid rgba(32,38,92,0.55); display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono',monospace; font-size:clamp(6px,1.7vw,10px); text-align:center; color:var(--ink); background:#fafafa; line-height:1.15;}
  .room.bar{background:#ece6f7;} .room.df{background:#f7f5f2; letter-spacing:0.08em;} .room.ht{border-style:dashed; background:#fdfcfb;}
  .tbl{position:absolute; width:4.4%; aspect-ratio:1/1; border-radius:50%; border:1px solid rgba(75,58,150,0.35); background:#f1ecfa;
    transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-size:clamp(5px,1.3vw,9px); color:rgba(32,38,92,0.6);}
  .tbl.me{background:var(--wine); border-color:var(--wine); color:#fff; z-index:5; width:7%; font-size:clamp(9px,2.3vw,15px); font-weight:600;
    box-shadow:0 0 0 4px rgba(201,169,97,0.55); animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(201,169,97,0.6);}50%{box-shadow:0 0 0 9px rgba(201,169,97,0);}}
  @media (prefers-reduced-motion:reduce){.tbl.me{animation:none;}}
  .mapnote{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.06em; color:#6a6255; margin:8px 0 0; text-transform:uppercase;}

  .mates{margin-top:18px; text-align:left; border-top:1px solid var(--line); padding-top:12px;}
  .mates h3{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--wine); margin:0 0 8px; font-weight:400; text-align:center;}
  .mates ul{list-style:none; margin:0; padding:0; columns:2; column-gap:18px; font-size:15px;}
  .mates li{padding:3px 0; break-inside:avoid;}
  @media (max-width:420px){.mates ul{columns:1;}}

  .back{display:inline-block; margin-top:16px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    background:none; border:1px solid var(--ink); color:var(--ink); padding:9px 14px; cursor:pointer;}
  .back:hover{background:var(--ink); color:var(--paper);}
  .empty{text-align:center; font-style:italic; color:#6a6255; margin-top:20px; line-height:1.5;}
  .foot{text-align:center; margin-top:34px; font-size:13px; color:#7a7264; font-style:italic;}
  [hidden]{display:none !important;}
</style>

asseril Babu",5],["Silpa John",5],["Simi Samuel",30],["Simon George",11],["Simoni Thomas",2],["Sofia Abraham",7],["Soma Raju",3],["Sonia Jaison",7],["Sony Antony",2],["Stanley Eapen Cherian",29],["Stanley George",8],["Steffy Mathew",7],["Stephen Karunakaran",25],["Stephy Johnson",16],["Steve Mathew",21],["Suja George",9],["Suja Mathew",9],["Suma Mathew",15],["Susan Abraham",10],["Susan Alexander",11],["Susan Johnson",30],["Susan Robinson",24],["Susan Thomas",28],["Suzane Thomas",13],["Sylas George",11],["Teena Velurethu",7],["Thomas Abraham",10],["Thomas Jacob",22],["Thomas Kodithoppil",10],["Thomas Varghese (Babuchan)",2],["Thomas Varghese (Kunjuotty)",3],["Tincy Stanley",29],["Tinsa Varghese",4],["Tony Joesph",11],["Valsamma Mathew",6],["Varghese Ninan",4],["Varshitha Dantuluri",25],["Vinu Joseph",17],["Wesley Thampy",19],["Zachary Chandapillai",21]];

  };

    1:[52.0,30.2], 2:[46.3,30.2], 3:[40.5,30.2], 4:[34.7,30.2], 5:[33.0,36.8], 6:[38.4,36.9], 7:[43.8,36.8], 8:[49.2,36.8], 9:[54.1,36.9], 10:[53.3,44.0], 11:[44.2,44.1], 12:[33.8,44.1], 13:[26.4,50.7], 14:[35.1,53.4], 15:[40.4,50.7], 16:[45.8,55.6], 17:[51.2,50.6], 18:[57.0,54.5], 19:[63.7,53.9], 20:[69.9,55.0], 21:[67.8,60.0], 22:[61.5,60.1], 23:[31.8,58.4], 24:[26.4,57.7], 25:[20.2,58.4], 26:[25.9,65.6], 27:[62.0,79.9], 28:[68.6,79.9], 29:[72.3,87.1], 30:[65.3,87.1]

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function norm(s){
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  }

  function buildEntries(){
    var counts = {};
    PEOPLE.forEach(function(p){ var k = norm(p[0]); counts[k] = (counts[k] || 0) + 1; });
    entries = PEOPLE.map(function(p, i){
      var k = norm(p[0]), via = null;
      via = HINTS[p[0] + '|' + p[1]] || null;
      if (counts[k] > 1) {
        if (!via) {
          var near = PEOPLE.filter(function(o, j){ return j !== i && o[1] === p[1]; }).slice(0, 2).map(function(o){ return o[0]; });

        }
      }
      return { pid: i, name: p[0], t: p[1], via: via, dup: counts[k] > 1, key: k };

  }

  function score(entry, tokens){
    var words = entry.key.split(' ');
    var total = 0;
    for (var i = 0; i < tokens.length; i++) {
      var tk = tokens[i], best = 0;
      for (var j = 0; j < words.length; j++) {
        var w = words[j];
        if (w === tk) best = Math.max(best, 3);
        else if (w.indexOf(tk) === 0) best = Math.max(best, 2);
        else if (tk.length >= 3 && w.indexOf(tk) !== -1) best = Math.max(best, 1);
      }
      if (!best) return 0;
      total += best;
    }
    if (entry.key === tokens.join(' ')) total += 4;
    return total;
  }

  function search(text){
    var tokens = norm(text).split(' ').filter(Boolean);
    if (!tokens.length) return [];
    var out = [];
    entries.forEach(function(e){
      var s = score(e, tokens);
      if (s) out.push({ e: e, s: s });
    });
    out.sort(function(a, b){ return b.s - a.s || a.e.name.localeCompare(b.e.name); });
    // collapse duplicates (same person listed twice)
    var seen = {}, res = [];
    out.forEach(function(o){
      var k = o.e.pid + '|' + o.e.key;
      if (seen[k]) return; seen[k] = 1; res.push(o.e);
    });
    return res.slice(0, 12);
  }

  function showResults(list, text){
    detailEl.hidden = true;
    resultsEl.hidden = false;

    if (!list.length) {

      return;

    resultsEl.innerHTML = list.map(function(e, i){
      return '<button type="button" class="res" data-i="' + i + '"><span>' + esc(e.name) +
        (e.via ? '<small>' + esc(e.via.charAt(0).toUpperCase() + e.via.slice(1)) + '</small>' : '') +

    }).join('');
    Array.prototype.forEach.call(resultsEl.querySelectorAll('.res'), function(b){
      b.addEventListener('click', function(){ showDetail(list[parseInt(b.getAttribute('data-i'), 10)]); });
    });
  }

    });
    var pos = TABLE_POS[t];
    var origin = pos ? ('transform-origin:' + pos[0] + '% ' + pos[1] + '%;') : '';
    return '<div class="map" id="theMap" role="img" aria-label="Floor plan with Table ' + t + ' highlighted"><div class="mapin" style="' + origin + '">' + inner + '</div></div>' +
      '<button type="button" class="zoombtn" id="zoomBtn">Zoom in on my table</button>';
  }

  function showDetail(e){
    if (!e.t) {
      detailEl.innerHTML = '<div class="card"><p class="who">' + esc(e.name) + '</p>' +
        (e.via ? '<p class="via">in ' + esc(e.via) + '&rsquo;s party</p>' : '') +
        '<p class="label">Your table</p><div class="bignum" style="font-size:44px;padding:18px 0">Still being assigned</div>' +
        '<p class="party">Please check with a member of the wedding party and we&rsquo;ll get you seated.</p>' +
        '<button type="button" class="back" id="backBtn">&larr; Search again</button></div>';
      resultsEl.hidden = true; detailEl.hidden = false;
      document.getElementById('backBtn').addEventListener('click', function(){ detailEl.hidden = true; resultsEl.hidden = false; q.focus(); q.select(); });
      return;
    }
    var mates = PEOPLE.map(function(p, i){ return { n: p[0], t: p[1], id: i }; })
      .filter(function(g){ return g.t === e.t && g.id !== e.pid; })
      .sort(function(a, b){ return a.n.localeCompare(b.n); });
    var party = null;
    var matesHtml = mates.length
      ? '<div class="mates"><h3>Also at Table ' + e.t + '</h3><ul>' +
        mates.map(function(g){ return '<li>' + esc(g.n) + '</li>'; }).join('') + '</ul></div>'
      : '';
    detailEl.innerHTML =
      '<div class="card">' +
        '<p class="who">' + esc(e.name) + '</p>' +
        (e.via ? '<p class="via">' + esc(e.via) + '</p>' : '') +
        mapHtml(e.t) +
        '<p class="mapnote">Grand Ballroom &middot; your table is highlighted</p>' +
        '<p class="label">You are seated at table</p>' +
        '<div class="bignum">' + e.t + '</div>' +
        (party && party.s > 1 ? '<p class="party">Party of ' + party.s + '</p>' : '') +
        matesHtml +
        '<button type="button" class="back" id="backBtn">&larr; Search again</button>' +
      '</div>';
    resultsEl.hidden = true;
    detailEl.hidden = false;
    var zb = document.getElementById('zoomBtn'), mp = document.getElementById('theMap');
    zb.addEventListener('click', function(){
      var z = mp.classList.toggle('zoomed');
      zb.textContent = z ? 'Show full room' : 'Zoom in on my table';
    });
    document.getElementById('backBtn').addEventListener('click', function(){
      detailEl.hidden = true; resultsEl.hidden = false; q.focus(); q.select();
    });
    if (detailEl.scrollIntoView) detailEl.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function run(){
    var text = q.value;
    var list = search(text);
    showResults(list, text);
  }
  q.addEventListener('input', run);
  q.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') {
      var list = search(q.value);
      if (list.length === 1) showDetail(list[0]);
      else if (list.length > 1) { var b = resultsEl.querySelector('.res'); if (b) b.focus(); }
    }
  });

  buildEntries();
})();
</script>
</body>
</html>
