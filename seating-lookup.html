  .lead{text-align:center; font-size:17px; line-height:1.5; margin:0 0 18px; color:#3b3f6b;}

  .search{position:relative;}
  .search input{
    width:100%; font-family:'Newsreader',serif; font-size:20px; padding:15px 16px;
    border:1px solid var(--ink); background:#fff; color:var(--ink); border-radius:0;
    box-shadow:0 14px 28px -20px rgba(32,38,92,0.45);
  }
  .search input:focus{outline:2px solid var(--gold); outline-offset:2px;}
  .hint{font-size:13px; font-style:italic; color:#6a6255; margin:8px 2px 0; text-align:center;}

  .results{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .res{
    display:flex; justify-content:space-between; align-items:center; gap:12px; text-align:left; width:100%;

  .zoombtn:hover{background:var(--wine); color:var(--paper);}

  .mates h3{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--wine); margin:0 0 8px; font-weight:400; text-align:center;}

    1:[52.0,30.2], 2:[46.3,30.2], 3:[40.5,30.2], 4:[34.7,30.2], 5:[33.0,36.8], 6:[38.4,36.9], 7:[43.8,36.8], 8:[49.2,36.8], 9:[54.1,36.9], 10:[53.3,44.0], 11:[44.2,44.1], 12:[33.8,44.1], 13:[26.4,50.7], 14:[35.1,53.4], 15:[40.4,50.7], 16:[45.8,55.6], 17:[51.2,50.6], 18:[57.0,54.5], 19:[63.7,53.9], 20:[69.9,55.0], 21:[67.8,60.0], 22:[61.5,60.1], 23:[31.8,58.4], 24:[26.4,57.7], 25:[20.2,58.4], 26:[25.9,65.6], 27:[62.0,79.9], 28:[68.6,79.9], 29:[72.3,87.1], 30:[65.3,87.1]
  };
  var CHROME = [
    ['room','left:19.3%;top:24.6%;width:6.7%;height:10%;','Ladies<br>Room'],
    ['room','left:19.3%;top:34.7%;width:6.7%;height:7.8%;','Mens<br>Room'],
    ['room bar','left:8.3%;top:46.7%;width:10.5%;height:6.5%;','BAR'],
    ['room bar','left:9%;top:86%;width:9.1%;height:5.5%;','BAR'],
    ['room','left:19.3%;top:77.1%;width:10.9%;height:5.7%;','BAND'],
    ['room df','left:32.5%;top:62.7%;width:24.5%;height:23.9%;','DANCE FLOOR'],
    ['room','left:40.4%;top:81%;width:8.4%;height:4.3%;','B&amp;G'],
    ['room ht','left:80.6%;top:47.3%;width:9%;height:7.8%;','Head<br>Table'],
    ['room ht','left:80.6%;top:75.1%;width:9%;height:7.8%;','Head<br>Table']
  ];

  var q = document.getElementById('q');
  var resultsEl = document.getElementById('results');
  var detailEl = document.getElementById('detail');
  var hintEl = document.getElementById('hint');
  var entries = [];   // searchable: {planId, label, display, t, viaParty}

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function norm(s){
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
  }

  function buildEntries(){
    entries = [];
    PLAN.forEach(function(g){
      var hd = g.fam ? PLAN.find(function(x){ return x.id === g.fam; }) : null;
      entries.push({ pid: g.id, name: g.n, t: g.t, via: hd ? hd.n : null, key: norm(g.n) });
      (ALIASES[g.id] || []).forEach(function(a){
        entries.push({ pid: g.id, name: a, t: g.t, via: g.n, key: norm(a) });
      });
    });
  }

  function score(entry, tokens){
    var words = entry.key.split(' ');
    var total = 0;
    for (var i = 0; i < tokens.length; i++) {
      var tk = tokens[i], best = 0;
      for (var j = 0; j < words.length; j++) {
        var w = words[j];
        if (w === tk) best = Math.max(best, 3);
        else if (w.indexOf(tk) === 0) best = Math.max(best, 2);
        else if (tk.length >= 3 && w.indexOf(tk) !== -1) best = Math.max(best, 1);
      }
      if (!best) return 0;
      total += best;
    }
    if (entry.key === tokens.join(' ')) total += 4;
    return total;
  }

  function search(text){
    var tokens = norm(text).split(' ').filter(Boolean);
    if (!tokens.length) return [];
    var out = [];
    entries.forEach(function(e){
      var s = score(e, tokens);
      if (s) out.push({ e: e, s: s });
    });
    out.sort(function(a, b){ return b.s - a.s || a.e.name.localeCompare(b.e.name); });
    // collapse duplicates (same person listed twice)
    var seen = {}, res = [];
    out.forEach(function(o){
      var k = o.e.pid + '|' + o.e.key;
      if (seen[k]) return; seen[k] = 1; res.push(o.e);
    });
    return res.slice(0, 12);
  }

  function showResults(list, text){
    detailEl.hidden = true;
    resultsEl.hidden = false;
    if (!norm(text)) { resultsEl.innerHTML = ''; hintEl.hidden = false; return; }
    hintEl.hidden = true;
    if (!list.length) {
      resultsEl.innerHTML = '<p class="empty">We couldn&rsquo;t find &ldquo;' + esc(text.trim()) + '&rdquo;.<br>Try a different spelling, or just your last name.</p>';
      return;
    }
    resultsEl.innerHTML = list.map(function(e, i){
      return '<button type="button" class="res" data-i="' + i + '"><span>' + esc(e.name) +
        (e.via ? '<small>Seated with ' + esc(e.via) + '&rsquo;s party</small>' : '') +
        '</span><span class="tb">' + (e.t ? 'Table ' + e.t : 'Table TBD') + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(resultsEl.querySelectorAll('.res'), function(b){
      b.addEventListener('click', function(){ showDetail(list[parseInt(b.getAttribute('data-i'), 10)]); });
    });
  }

  function mapHtml(t){
    var inner = CHROME.map(function(c){ return '<div class="' + c[0] + '" style="' + c[1] + '">' + c[2] + '</div>'; }).join('');
    Object.keys(TABLE_POS).forEach(function(k){
      var p = TABLE_POS[k], me = parseInt(k, 10) === t;
      inner += '<div class="tbl' + (me ? ' me' : '') + '" style="left:' + p[0] + '%;top:' + p[1] + '%">' + k + '</div>';
    });
    var pos = TABLE_POS[t];
    var origin = pos ? ('transform-origin:' + pos[0] + '% ' + pos[1] + '%;') : '';
    return '<div class="map" id="theMap" role="img" aria-label="Floor plan with Table ' + t + ' highlighted"><div class="mapin" style="' + origin + '">' + inner + '</div></div>' +
      '<button type="button" class="zoombtn" id="zoomBtn">Zoom in on my table</button>';
  }

  function showDetail(e){
    if (!e.t) {
      detailEl.innerHTML = '<div class="card"><p class="who">' + esc(e.name) + '</p>' +
        (e.via ? '<p class="via">in ' + esc(e.via) + '&rsquo;s party</p>' : '') +
        '<p class="label">Your table</p><div class="bignum" style="font-size:44px;padding:18px 0">Still being assigned</div>' +
        '<p class="party">Please check with a member of the wedding party and we&rsquo;ll get you seated.</p>' +
        '<button type="button" class="back" id="backBtn">&larr; Search again</button></div>';
      resultsEl.hidden = true; detailEl.hidden = false;
      document.getElementById('backBtn').addEventListener('click', function(){ detailEl.hidden = true; resultsEl.hidden = false; q.focus(); q.select(); });
      return;
    }
    var mates = PLAN.filter(function(g){ return g.t === e.t && g.id !== e.pid; });
    var party = PLAN.find(function(g){ return g.id === e.pid; });
    var matesHtml = mates.length
      ? '<div class="mates"><h3>Also at Table ' + e.t + '</h3><ul>' +
        mates.map(function(g){ return '<li>' + esc(g.n) + '</li>'; }).join('') + '</ul></div>'
      : '';
    detailEl.innerHTML =
      '<div class="card">' +
        '<p class="who">' + esc(e.name) + '</p>' +
        (e.via ? '<p class="via">in ' + esc(e.via) + '&rsquo;s party</p>' : '') +
        mapHtml(e.t) +
        '<p class="mapnote">Grand Ballroom &middot; your table is highlighted</p>' +
        '<p class="label">You are seated at table</p>' +
        '<div class="bignum">' + e.t + '</div>' +
        (party && party.s > 1 ? '<p class="party">Party of ' + party.s + '</p>' : '') +
        matesHtml +
        '<button type="button" class="back" id="backBtn">&larr; Search again</button>' +
      '</div>';
    resultsEl.hidden = true;
    detailEl.hidden = false;
    var zb = document.getElementById('zoomBtn'), mp = document.getElementById('theMap');
    zb.addEventListener('click', function(){
      var z = mp.classList.toggle('zoomed');
      zb.textContent = z ? 'Show full room' : 'Zoom in on my table';
    });
    document.getElementById('backBtn').addEventListener('click', function(){
      detailEl.hidden = true; resultsEl.hidden = false; q.focus(); q.select();
    });
    if (detailEl.scrollIntoView) detailEl.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function run(){
    var text = q.value;
    var list = search(text);
    showResults(list, text);
  }
  q.addEventListener('input', run);
  q.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') {
      var list = search(q.value);
      if (list.length === 1) showDetail(list[0]);
      else if (list.length > 1) { var b = resultsEl.querySelector('.res'); if (b) b.focus(); }
    }
  });

  async function loadLive(){
    if (!client) return;
    try {
      var res = await client.from('seating_plan').select('data').eq('id', 'main2').maybeSingle();
      if (!res.error && res.data && Array.isArray(res.data.data) && res.data.data.length) {
        PLAN = res.data.data;
        buildEntries();
        if (!detailEl.hidden) { /* keep current card */ } else run();
      }
    } catch(e){}
  }

  buildEntries();
  loadLive();
})();
</script>
</body>
</html>
